[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoswarm"
version = "0.1.0"
description = "Direccionamiento de enjambres de nanopartículas magnéticas con aprendizaje por refuerzo en entornos vasculares simulados"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Brayan Bruce Pérez Escobar" }]
requires-python = ">=3.10"
dependencies = [
    # Fijar versiones exactas (==) al cerrar el piloto
    "numpy",
    "scipy",
    "gymnasium",
    "stable-baselines3",
    "torch",
    "pyyaml",
    "pandas",
    "matplotlib",
    "tensorboard",
]

[project.optional-dependencies]
dreamer = ["jax"]
dev = ["pytest", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
